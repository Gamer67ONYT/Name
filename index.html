<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V: THE DEFINITIVE TRIVIA</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@600;700&display=swap');

        :root {
            --gta-green: #2ecc71;
            --gta-red: #e74c3c;
            --gta-gold: #f1c40f;
            --gta-blue: #3498db;
            --ui-bg: rgba(0, 0, 0, 0.85);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Rajdhani', sans-serif;
            color: #fff; overflow: hidden;
            background-color: #0a0a0a;
        }

        /* HARDWARE ACCELERATED VIDEO BACKGROUND */
        .video-container {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -5; overflow: hidden;
        }

        #bg-video {
            width: 100%; height: 100%;
            object-fit: cover;
            filter: brightness(0.3) contrast(1.1) saturate(1.3);
        }

        /* FALLBACK ANIMATION (If video fails) */
        .video-fallback {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -6;
            background: linear-gradient(125deg, #050505, #1a1a2e, #16213e, #0f3460);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* UI OVERLAYS */
        .vignette {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 30%, rgba(0,0,0,0.9) 100%);
            z-index: -2; pointer-events: none;
        }

        .crt-scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            z-index: -1; pointer-events: none;
        }

        /* MAIN GAME BOX */
        .container {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh; padding: 20px;
        }

        .game-card {
            background: var(--ui-bg);
            border: 2px solid var(--glass-border);
            border-left: 8px solid var(--gta-green);
            padding: 40px; width: 100%; max-width: 900px;
            box-shadow: 0 50px 100px rgba(0,0,0,0.9);
            position: relative;
        }

        h1 {
            font-family: 'Bebas Neue', cursive; font-size: 5rem;
            text-align: left; margin: 0 0 20px 0; letter-spacing: 2px;
            text-shadow: 3px 3px 0 #000;
        }

        /* HUD STYLING */
        .hud-bar {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 25px;
            font-family: 'Bebas Neue', cursive; font-size: 2.2rem;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 10px;
        }

        .stat-money { color: var(--gta-green); text-shadow: 0 0 10px rgba(46, 204, 113, 0.4); }
        .stat-stars { color: var(--gta-gold); letter-spacing: 5px; }

        /* TIMER BAR */
        .progress-rail {
            width: 100%; height: 10px; background: rgba(255,255,255,0.1);
            margin-bottom: 30px; border-radius: 2px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; width: 100%; background: var(--gta-green);
            transition: width 1s linear, background-color 0.3s;
        }

        /* QUESTION AREA */
        #question-display {
            font-size: 2.2rem; font-weight: 700; text-align: left;
            margin-bottom: 40px; min-height: 100px; line-height: 1.2;
        }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        .btn-choice {
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            color: #fff; padding: 25px; font-size: 1.4rem; font-weight: 600;
            cursor: pointer; transition: 0.2s; text-transform: uppercase;
            text-align: left;
        }

        .btn-choice:hover { background: #fff; color: #000; transform: translateX(10px); }
        .btn-choice.correct { background: var(--gta-green) !important; color: #000; }
        .btn-choice.wrong { background: var(--gta-red) !important; color: #fff; }

        /* FOOTER FEEDBACK (NO OVERLAP) */
        .status-ticker {
            position: absolute; bottom: -80px; left: 0; width: 100%;
            background: var(--gta-gold); color: #000;
            font-family: 'Bebas Neue', cursive; font-size: 3rem;
            text-align: center; padding: 10px 0;
            transform: translateY(20px); opacity: 0;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
        }

        .status-ticker.active { transform: translateY(0); opacity: 1; }

        /* SCREENS */
        .screen { display: none; }
        .active-screen { display: block; animation: fadeIn 0.5s ease-out; }

        .big-action-btn {
            background: var(--gta-green); color: #000; border: none;
            padding: 20px 80px; font-family: 'Bebas Neue', cursive;
            font-size: 3rem; cursor: pointer; transition: 0.3s;
        }
        .big-action-btn:hover { background: #fff; transform: scale(1.05); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <!-- VIDEO SYSTEM WITH FAILSAFE -->
    <div class="video-fallback"></div>
    <div class="video-container">
        <video id="bg-video" autoplay loop muted playsinline>
            <!-- Primary Link (Stable CDN) -->
            <source src="https://assets.mixkit.co/videos/preview/mixkit-city-traffic-at-night-seen-from-a-high-angle-34446-large.mp4" type="video/mp4">
        </video>
    </div>

    <div class="vignette"></div>
    <div class="crt-scanlines"></div>

    <div class="container">
        <div class="game-card">
            
            <!-- INITIALIZE SCREEN -->
            <div id="screen-start" class="screen active-screen">
                <h1>MISSION: LOS SANTOS TRIVIA</h1>
                <p style="font-size: 1.5rem; color: #aaa; margin-bottom: 40px;">Intel verified. The heist is ready. Do not fail the crew.</p>
                <button class="big-action-btn" onclick="runGame()">BEGIN HEIST</button>
            </div>

            <!-- ACTIVE MISSION SCREEN -->
            <div id="screen-game" class="screen">
                <div class="hud-bar">
                    <div class="stat-money" id="hud-money">$000,000,000</div>
                    <div class="stat-stars" id="hud-stars">★★★★★</div>
                </div>
                <div class="progress-rail"><div class="progress-fill" id="timer-bar"></div></div>
                <div id="question-display">CONNECTING TO LESTER...</div>
                <div class="options-grid" id="options-box"></div>
                
                <!-- FEEDBACK TICKER (Bottom anchored, no overlap) -->
                <div id="feedback-ticker" class="status-ticker">RESPECT +</div>
            </div>

            <!-- RESULTS SCREEN -->
            <div id="screen-end" class="screen" style="text-align: center;">
                <h2 id="final-status" style="font-family: 'Bebas Neue', cursive; font-size: 6rem; margin: 0;"></h2>
                <div id="final-take" style="font-size: 4rem; color: var(--gta-green); font-family: 'Bebas Neue'; margin-bottom: 30px;"></div>
                <button class="big-action-btn" onclick="location.reload()">RE-REUNITE THE GANG</button>
            </div>

        </div>
    </div>

    <script>
        const questData = [
            { q: "Which protagonist is a retired bank robber?", o: ["Franklin", "Lamar", "Michael", "Trevor"], a: 2 },
            { q: "What is the name of Franklin's dog?", o: ["Chop", "Buster", "Rex", "Killer"], a: 0 },
            { q: "What is the highest point in the game?", o: ["Mount Gordo", "Mount Chiliad", "Vinewood Sign", "Maze Bank"], a: 1 },
            { q: "Who runs Trevor Philips Enterprises?", o: ["Ron", "Wade", "Lester", "Trevor"], a: 3 },
            { q: "Which company created the 'iFruit' phone?", o: ["Fruit", "Badger", "Shark", "Whiz"], a: 0 },
            { q: "What color do the Ballas wear?", o: ["Green", "Purple", "Yellow", "Blue"], a: 1 },
            { q: "Where is the military base located?", o: ["Vespucci", "Paleto Bay", "Fort Zancudo", "Sandy Shores"], a: 2 },
            { q: "What is the name of the main fictional city?", o: ["Vice City", "Los Santos", "Liberty City", "San Fierro"], a: 1 },
            { q: "What is the social media parody name?", o: ["Facelink", "Lifeinvader", "Instapic", "Chirper"], a: 1 },
            { q: "Who gives Franklin the assassination missions?", o: ["Michael", "Simeon", "Lester", "Devin"], a: 2 },
            { q: "What kind of dog is Chop?", o: ["Pitbull", "Rottweiler", "Bulldog", "German Shepherd"], a: 1 },
            { q: "What is the final heist called?", o: ["The Big Score", "The Bureau Raid", "The Jewel Store Job", "The Paleto Score"], a: 0 }
        ];

        let activeSet = [];
        let index = 0;
        let wallet = 0;
        let health = 5;
        let clock;
        let timeRemaining = 15;
        let busy = false;

        // Force video play on first click (Browser Bypass)
        document.addEventListener('click', () => {
            const v = document.getElementById('bg-video');
            if (v.paused) v.play();
        }, { once: true });

        function runGame() {
            activeSet = [...questData].sort(() => 0.5 - Math.random()).slice(0, 10);
            index = 0; wallet = 0; health = 5;
            document.getElementById('screen-start').classList.remove('active-screen');
            document.getElementById('screen-game').classList.add('active-screen');
            refreshUI();
            nextQuestion();
        }

        function refreshUI() {
            document.getElementById('hud-money').innerText = `$${wallet.toLocaleString()}`;
            let stars = "";
            for(let i=0; i<5; i++) stars += (i < health) ? "★" : "☆";
            document.getElementById('hud-stars').innerText = stars;
            document.getElementById('hud-stars').style.color = (health <= 1) ? "var(--gta-red)" : "var(--gta-gold)";
        }

        function nextQuestion() {
            if(health <= 0) return finish(false);
            if(index >= activeSet.length) return finish(true);

            busy = false;
            const current = activeSet[index];
            document.getElementById('question-display').innerText = current.q;
            const box = document.getElementById('options-box');
            box.innerHTML = "";

            current.o.forEach((opt, i) => {
                const b = document.createElement('button');
                b.className = 'btn-choice';
                b.innerText = opt;
                b.onclick = () => validate(i, b);
                box.appendChild(b);
            });

            resetClock();
        }

        function resetClock() {
            clearInterval(clock);
            timeRemaining = 15;
            const bar = document.getElementById('timer-bar');
            bar.style.transition = 'none';
            bar.style.width = '100%';
            bar.style.backgroundColor = 'var(--gta-green)';
            setTimeout(() => bar.style.transition = 'width 1s linear', 50);

            clock = setInterval(() => {
                timeRemaining--;
                bar.style.width = `${(timeRemaining/15)*100}%`;
                if(timeRemaining <= 5) bar.style.backgroundColor = 'var(--gta-red)';
                if(timeRemaining <= 0) { clearInterval(clock); validate(-1, null); }
            }, 1000);
        }

        function validate(choice, btn) {
            if(busy) return;
            busy = true;
            clearInterval(clock);

            const answer = activeSet[index].a;
            const allBtns = document.querySelectorAll('.btn-choice');
            const ticker = document.getElementById('feedback-ticker');

            if(choice === answer) {
                if(btn) btn.classList.add('correct');
                wallet += 150000;
                ticker.innerText = "RESPECT +";
                ticker.style.background = "var(--gta-green)";
            } else {
                if(btn) btn.classList.add('wrong');
                allBtns[answer].classList.add('correct');
                health--;
                ticker.innerText = "WASTED";
                ticker.style.background = "var(--gta-red)";
            }

            ticker.classList.add('active');
            refreshUI();
            index++;
            
            setTimeout(() => {
                ticker.classList.remove('active');
                nextQuestion();
            }, 2000);
        }

        function finish(win) {
            document.getElementById('screen-game').classList.remove('active-screen');
            document.getElementById('screen-end').classList.add('active-screen');
            const title = document.getElementById('final-status');
            title.innerText = win ? "HEIST SUCCESSFUL" : "MISSION FAILED";
            title.style.color = win ? "var(--gta-gold)" : "var(--gta-red)";
            document.getElementById('final-take').innerText = `TOTAL TAKE: $${wallet.toLocaleString()}`;
        }
    </script>
</body>
</html>
