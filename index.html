<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V Pro Trivia Database</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Inter', sans-serif;
            color: #fff;
            overflow: hidden;
            background-color: #000;
        }

        /* Native HTML5 Video Background */
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            overflow: hidden;
        }

        video {
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            object-fit: cover;
            filter: brightness(0.35) contrast(1.2); /* Darkens and makes neon pop */
        }

        /* Dark Overlay for depth */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.8) 100%);
            z-index: -1;
            pointer-events: none;
        }

        /* Pro UI Layout */
        .app-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInDown 1s ease-out;
        }

        h1 {
            font-family: 'Bebas Neue', cursive;
            font-size: 5rem;
            color: #fff;
            letter-spacing: 6px;
            margin: 0;
            text-shadow: 0 0 20px rgba(46, 204, 113, 0.5), 0px 4px 0px rgba(0,0,0,1);
        }

        h1 span {
            color: #2ecc71; /* Rockstar Green */
        }

        .progress-bar {
            font-size: 1rem;
            color: #a0a0a0;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 5px;
        }

        /* Glassmorphism Card */
        .quiz-card {
            background: rgba(20, 20, 20, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #2ecc71;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            text-align: center;
            transition: all 0.3s ease;
        }

        #question-text {
            font-size: 1.6rem;
            margin-bottom: 35px;
            font-weight: 600;
            line-height: 1.4;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.8);
        }

        /* Modern Buttons */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 16px;
            font-size: 1.1rem;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            background: rgba(46, 204, 113, 0.1);
            border-color: #2ecc71;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .btn.correct {
            background: #2ecc71;
            color: #000;
            border-color: #2ecc71;
            transform: scale(1.02);
        }

        .btn.wrong {
            background: #e74c3c;
            color: #fff;
            border-color: #e74c3c;
        }

        /* Feedback Area */
        #feedback {
            margin-top: 25px;
            font-family: 'Bebas Neue', cursive;
            font-size: 3.5rem;
            letter-spacing: 4px;
            display: none;
            animation: zoomIn 0.3s ease-out forwards;
        }

        .action-btn {
            margin-top: 25px;
            background: #fff;
            color: #000;
            border: none;
            padding: 16px 32px;
            font-size: 1.2rem;
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 8px;
            width: 100%;
            transition: 0.2s;
            display: none;
        }

        .action-btn:hover {
            background: #2ecc71;
            color: #000;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.4);
        }

        /* Screens */
        #quiz-screen, #end-screen {
            display: none;
        }

        .final-score {
            font-size: 4rem;
            font-family: 'Bebas Neue', cursive;
            color: #fff;
            margin-bottom: 10px;
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .fade-in {
            animation: zoomIn 0.4s ease-out forwards;
        }
    </style>
</head>
<body>

    <!-- Professional Native HTML5 Video Background -->
    <div class="video-container">
        <!-- Direct MP4 link to a cinematic night city flight (No YouTube branding, never breaks) -->
        <video autoplay loop muted playsinline>
            <source src="https://cdn.pixabay.com/video/2018/06/08/16668-273874404_large.mp4" type="video/mp4">
        </video>
    </div>
    <div class="overlay"></div>

    <div class="app-container">
        <div class="header">
            <h1>LOS SANTOS <span>TRIVIA</span></h1>
            <div class="progress-bar" id="progress">Awaiting Connection...</div>
        </div>

        <div class="quiz-card" id="card-container">
            
            <!-- Start Screen -->
            <div id="start-screen" class="fade-in">
                <p style="font-size: 1.1rem; color: #ccc; margin-bottom: 30px; line-height: 1.6;">
                    Accessing Secure Database...<br>
                    You will receive 10 randomized inquiries per session.<br>
                    Precision is mandatory.
                </p>
                <button id="start-btn" class="action-btn" style="display: block;" onclick="startQuiz()">Initialize Heist</button>
            </div>

            <!-- Quiz Screen -->
            <div id="quiz-screen">
                <div id="question-text"></div>
                <div class="options-grid" id="options-container"></div>
                <div id="feedback"></div>
                <button id="next-btn" class="action-btn" onclick="nextQuestion()">Next Target</button>
            </div>

            <!-- End Screen -->
            <div id="end-screen">
                <div id="end-title" style="font-family: 'Bebas Neue', cursive; font-size: 4.5rem; letter-spacing: 2px;"></div>
                <div class="final-score" id="final-score-text"></div>
                <p id="end-message" style="font-size: 1.1rem; color: #ccc; margin-bottom: 30px; line-height: 1.6;"></p>
                <button id="restart-btn" class="action-btn" style="display: block;" onclick="startQuiz()">Run It Back</button>
            </div>
        </div>
    </div>

    <script>
        // Professional Extended Database
        const fullDatabase = [
            { question: "What is the name of the fictional city in GTA V?", options: ["Liberty City", "Vice City", "Los Santos", "San Fierro"], answer: 2 },
            { question: "Which character is a retired, wealthy bank robber?", options: ["Franklin Clinton", "Trevor Philips", "Michael De Santa", "Lamar Davis"], answer: 2 },
            { question: "What is the name of Franklin's dog?", options: ["Chop", "Buster", "Dawg", "Killer"], answer: 0 },
            { question: "What company makes the 'iFruit' phone?", options: ["Fruit", "Badger", "Shark", "Lifeinvader"], answer: 0 },
            { question: "Who runs Trevor Philips Enterprises?", options: ["Ron Jakowski", "Wade Hebert", "Chef", "Trevor Philips"], answer: 3 },
            { question: "What is the highest mountain in GTA V?", options: ["Mount Gordo", "Mount Josiah", "Mount Chiliad", "Mount Tataviam"], answer: 2 },
            { question: "Which private military company serves as a major antagonist?", options: ["SecuroServ", "Merryweather Security", "Gruppe Sechs", "Ballas"], answer: 1 },
            { question: "What is the name of the social media parody of Facebook?", options: ["Bleeter", "Lifeinvader", "Snapmatic", "Chirper"], answer: 1 },
            { question: "Which protagonist lives in Sandy Shores?", options: ["Franklin", "Michael", "Lamar", "Trevor"], answer: 3 },
            { question: "What is the name of Michael's wife?", options: ["Tracey", "Amanda", "Ursula", "Maude"], answer: 1 },
            { question: "What color do the Ballas gang members wear?", options: ["Green", "Red", "Yellow", "Purple"], answer: 3 },
            { question: "Which vehicle is heavily armored and resembles a tank?", options: ["Kuruma", "Insurgent", "Rhino", "Zentorno"], answer: 2 },
            { question: "What is the name of the fictional stock market that responds to assassinations?", options: ["BAWSAQ", "LCN", "NASDAQ", "DOW"], answer: 0 },
            { question: "Who gives Franklin assassination missions?", options: ["Simeon", "Lester", "Martin Madrazo", "Devin Weston"], answer: 1 },
            { question: "What is the name of the military base in San Andreas?", options: ["Area 51", "Fort Zancudo", "Naval Station Los Santos", "Vespucci Base"], answer: 1 },
            { question: "Which radio station plays rock music hosted by Kenny Loggins?", options: ["Non-Stop-Pop FM", "Radio Los Santos", "Los Santos Rock Radio", "Channel X"], answer: 2 },
            { question: "What is the name of the cult located in the Chiliad Mountain State Wilderness?", options: ["The Epsilon Program", "Children of the Mountain", "Altruist Cult", "Kifflom"], answer: 2 },
            { question: "Which character says 'Yee-yee ass haircut'?", options: ["Franklin", "Simeon", "Stretch", "Lamar"], answer: 3 },
            { question: "What is the name of the strip club managed by Trevor?", options: ["Vanilla Unicorn", "The Hen House", "Bahama Mamas", "Tequil-la-la"], answer: 0 },
            { question: "Who is the corrupt FIB agent that manipulates Michael?", options: ["Steve Haines", "Dave Norton", "Andreas Sanchez", "Karen Daniels"], answer: 0 },
            { question: "What car dealership does Franklin initially work for?", options: ["Premium Deluxe Motorsport", "Sanders Motorcycles", "Legendary Motorsport", "Southern San Andreas Super Autos"], answer: 0 },
            { question: "Which heist is the final mission of the game?", options: ["The Jewel Store Job", "The Paleto Score", "The Bureau Raid", "The Big Score"], answer: 3 },
            { question: "What is the fictional equivalent of Hollywood in the game?", options: ["Rockford Hills", "Vinewood", "Vespucci Beach", "Richman"], answer: 1 },
            { question: "Which alien-worshipping religion can Michael join?", options: ["The Epsilon Program", "Altruist Cult", "Children of the Mountain", "Scientology"], answer: 0 },
            { question: "What is the name of Trevor's heavily modified truck?", options: ["The Liberator", "Bodhi", "Sandking", "Rebel"], answer: 1 },
            { question: "Who is the billionaire investor that acts as a major antagonist?", options: ["Martin Madrazo", "Solomon Richards", "Devin Weston", "Wei Cheng"], answer: 2 }
        ];

        let activeQuiz = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let acceptingAnswers = true;
        const QUESTIONS_PER_RUN = 10;

        const screens = {
            start: document.getElementById('start-screen'),
            quiz: document.getElementById('quiz-screen'),
            end: document.getElementById('end-screen')
        };
        
        const ui = {
            questionText: document.getElementById('question-text'),
            optionsContainer: document.getElementById('options-container'),
            progressText: document.getElementById('progress'),
            feedbackText: document.getElementById('feedback'),
            nextBtn: document.getElementById('next-btn'),
            card: document.getElementById('card-container')
        };

        function triggerAnimation() {
            ui.card.classList.remove('fade-in');
            void ui.card.offsetWidth; // Trigger reflow
            ui.card.classList.add('fade-in');
        }

        function startQuiz() {
            const shuffled = [...fullDatabase].sort(() => 0.5 - Math.random());
            activeQuiz = shuffled.slice(0, QUESTIONS_PER_RUN);
            
            currentQuestionIndex = 0;
            score = 0;
            
            screens.start.style.display = "none";
            screens.end.style.display = "none";
            screens.quiz.style.display = "block";
            
            loadQuestion();
        }

        function loadQuestion() {
            triggerAnimation();
            acceptingAnswers = true;
            ui.feedbackText.style.display = "none";
            ui.nextBtn.style.display = "none";
            ui.optionsContainer.innerHTML = "";
            
            const currentQ = activeQuiz[currentQuestionIndex];
            ui.questionText.innerText = currentQ.question;
            ui.progressText.innerText = `Data Node ${currentQuestionIndex + 1} // ${QUESTIONS_PER_RUN}`;

            currentQ.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.innerText = option;
                button.classList.add('btn');
                button.onclick = () => checkAnswer(index, button);
                ui.optionsContainer.appendChild(button);
            });
        }

        function checkAnswer(selectedIndex, buttonClicked) {
            if (!acceptingAnswers) return;
            acceptingAnswers = false;

            const currentQ = activeQuiz[currentQuestionIndex];
            const correctIndex = currentQ.answer;
            const allButtons = ui.optionsContainer.children;

            if (selectedIndex === correctIndex) {
                buttonClicked.classList.add('correct');
                ui.feedbackText.innerText = "RESPECT +";
                ui.feedbackText.style.color = "#2ecc71";
                score++;
            } else {
                buttonClicked.classList.add('wrong');
                allButtons[correctIndex].classList.add('correct'); 
                ui.feedbackText.innerText = "WASTED";
                ui.feedbackText.style.color = "#e74c3c";
            }

            ui.feedbackText.style.display = "block";
            ui.nextBtn.style.display = "block";
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < activeQuiz.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            triggerAnimation();
            screens.quiz.style.display = "none";
            screens.end.style.display = "block";
            ui.progressText.innerText = "Session Terminated";

            const endTitle = document.getElementById('end-title');
            const finalScoreText = document.getElementById('final-score-text');
            const endMessage = document.getElementById('end-message');

            finalScoreText.innerText = `${score} // ${QUESTIONS_PER_RUN}`;

            if (score === QUESTIONS_PER_RUN) {
                endTitle.innerText = "CRIMINAL MASTERMIND";
                endTitle.style.color = "#2ecc71";
                endMessage.innerText = "Elite status confirmed. Your knowledge of Los Santos is unmatched.";
            } else if (score >= 7) {
                endTitle.innerText = "HEIST SUCCESSFUL";
                endTitle.style.color = "#f1c40f";
                endMessage.innerText = "Solid operation, but there is still room for improvement.";
            } else {
                endTitle.innerText = "MISSION FAILED";
                endTitle.style.color = "#e74c3c";
                endMessage.innerText = "Critical failure. You need to spend more time in the city.";
            }
        }
    </script>
</body>
</html>
