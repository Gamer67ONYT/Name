<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V Ultimate Quiz</title>
    <style>
        /* CSS for the "Great Graphics" feel */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Arial Black', Gadget, sans-serif;
            color: white;
            overflow: hidden;
        }

        /* Background Video/Image */
        .bg-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: black;
        }

        .bg-wrapper iframe {
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            transform: scale(1.5); /* Hide YouTube UI */
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6); /* Darkens the video so text is readable */
        }

        /* Quiz Container */
        .quiz-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 4rem;
            text-transform: uppercase;
            color: #2ecc71; /* GTA Green */
            text-shadow: 3px 3px 0px #000, 5px 5px 15px rgba(0,0,0,0.5);
            margin-bottom: 10px;
        }

        .card {
            background: rgba(20, 20, 20, 0.9);
            padding: 30px;
            border-radius: 10px;
            border-left: 10px solid #2ecc71;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .btn {
            background: transparent;
            border: 2px solid #2ecc71;
            color: white;
            padding: 15px 30px;
            margin: 10px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            width: 100%;
        }

        .btn:hover {
            background: #2ecc71;
            color: black;
            font-weight: bold;
            transform: scale(1.05);
        }

        #result {
            margin-top: 20px;
            font-size: 1.5rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="bg-wrapper">
        <!-- GTA 5 Cinematic Background -->
        <iframe src="https://www.youtube.com/embed/QkkoH9v0h68?autoplay=1&mute=1&controls=0&loop=1&playlist=QkkoH9v0h68" frameborder="0" allow="autoplay; encrypted-media"></iframe>
        <div class="overlay"></div>
    </div>

    <div class="quiz-container">
        <h1>GTA V QUIZ</h1>
        <div class="card" id="quiz-box">
            <h2 id="question">Who is the youngest of the three main protagonists?</h2>
            <div id="options">
                <button class="btn" onclick="checkAnswer(false)">Michael De Santa</button>
                <button class="btn" onclick="checkAnswer(true)">Franklin Clinton</button>
                <button class="btn" onclick="checkAnswer(false)">Trevor Philips</button>
            </div>
            <div id="result"></div>
        </div>
    </div>

    <script>
        function checkAnswer(isCorrect) {
            const resultDiv = document.getElementById('result');
            if (isCorrect) {
                resultDiv.innerHTML = "✅ WASTED! (Just kidding, you're correct!)";
                resultDiv.style.color = "#2ecc71";
            } else {
                resultDiv.innerHTML = "❌ MISSION FAILED";
                resultDiv.style.color = "#e74c3c";
            }
        }
    </script>
</body>
</html>
