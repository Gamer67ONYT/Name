<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V Ultimate Quiz</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;700&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Roboto', sans-serif;
            color: white;
            overflow: hidden;
            background-color: #000;
        }

        /* Cinematic Moving Background (Never breaks) */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
        }

        .bg-image {
            width: 100%;
            height: 100%;
            background-image: url('https://media.rockstargames.com/rockstargames/img/global/news/upload/actual_1364906194.jpg');
            background-size: cover;
            background-position: center;
            animation: panZoom 20s infinite alternate ease-in-out;
            filter: brightness(0.4); /* Darkens the background for text readability */
        }

        @keyframes panZoom {
            0% { transform: scale(1.1) translate(0px, 0px); }
            100% { transform: scale(1.3) translate(-20px, 15px); }
        }

        /* UI Layout */
        .app-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Bebas Neue', cursive;
            font-size: 4rem;
            color: #2ecc71; /* GTA Green */
            letter-spacing: 3px;
            margin: 0;
            text-shadow: 4px 4px 0px #000;
        }

        .progress-bar {
            font-size: 1.2rem;
            color: #f1c40f; /* GTA Gold */
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            margin-bottom: 10px;
        }

        /* Quiz Box */
        .quiz-card {
            background: rgba(15, 15, 15, 0.85);
            border: 2px solid #333;
            border-top: 5px solid #2ecc71;
            border-radius: 8px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
            text-align: center;
            backdrop-filter: blur(5px);
        }

        #question-text {
            font-size: 1.5rem;
            margin-bottom: 25px;
            font-weight: 700;
        }

        /* Buttons */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid transparent;
            color: white;
            padding: 15px;
            font-size: 1.2rem;
            font-family: 'Bebas Neue', cursive;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 4px;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #2ecc71;
            transform: translateX(10px);
        }

        .btn.correct {
            background: #2ecc71;
            color: black;
            border-color: #27ae60;
        }

        .btn.wrong {
            background: #e74c3c;
            color: white;
            border-color: #c0392b;
        }

        /* Feedback and Next Button */
        #feedback {
            margin-top: 20px;
            font-family: 'Bebas Neue', cursive;
            font-size: 2.5rem;
            letter-spacing: 2px;
            display: none;
        }

        #next-btn, #restart-btn {
            margin-top: 20px;
            background: #f39c12;
            color: black;
            border: none;
            padding: 15px 30px;
            font-size: 1.5rem;
            font-family: 'Bebas Neue', cursive;
            cursor: pointer;
            border-radius: 4px;
            display: none;
            width: 100%;
            transition: 0.2s;
        }

        #next-btn:hover, #restart-btn:hover {
            background: #e67e22;
        }

        /* End Screen */
        #end-screen {
            display: none;
        }

        .final-score {
            font-size: 3rem;
            color: white;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="bg-container">
        <div class="bg-image"></div>
    </div>

    <div class="app-container">
        <div class="header">
            <h1>LOS SANTOS TRIVIA</h1>
            <div class="progress-bar" id="progress">Question 1 of 5</div>
        </div>

        <div class="quiz-card">
            <!-- Quiz Screen -->
            <div id="quiz-screen">
                <div id="question-text">Loading question...</div>
                <div class="options-grid" id="options-container">
                    <!-- Buttons injected by JS -->
                </div>
                <div id="feedback"></div>
                <button id="next-btn" onclick="nextQuestion()">NEXT QUESTION</button>
            </div>

            <!-- End Screen -->
            <div id="end-screen">
                <div id="end-title" style="font-family: 'Bebas Neue', cursive; font-size: 4rem;"></div>
                <div class="final-score" id="final-score-text"></div>
                <p id="end-message" style="font-size: 1.2rem; margin-bottom: 20px;"></p>
                <button id="restart-btn" style="display: block;" onclick="restartQuiz()">PLAY AGAIN</button>
            </div>
        </div>
    </div>

    <script>
        const quizData = [
            {
                question: "What is the name of the fictional city in GTA V?",
                options: ["Liberty City", "Vice City", "Los Santos", "San Fierro"],
                answer: 2
            },
            {
                question: "Which character is a retired, wealthy bank robber?",
                options: ["Franklin Clinton", "Trevor Philips", "Michael De Santa", "Lamar Davis"],
                answer: 2
            },
            {
                question: "What is the name of Franklin's dog?",
                options: ["Chop", "Buster", "Dawg", "Killer"],
                answer: 0
            },
            {
                question: "What company makes the 'iFruit' phone in the game?",
                options: ["Fruit", "Badger", "Shark", "Lifeinvader"],
                answer: 0
            },
            {
                question: "Who runs Trevor Philips Enterprises?",
                options: ["Ron Jakowski", "Wade Hebert", "Chef", "Trevor Philips"],
                answer: 3
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let acceptingAnswers = true;

        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const progressText = document.getElementById('progress');
        const feedbackText = document.getElementById('feedback');
        const nextBtn = document.getElementById('next-btn');
        const quizScreen = document.getElementById('quiz-screen');
        const endScreen = document.getElementById('end-screen');

        function loadQuestion() {
            acceptingAnswers = true;
            feedbackText.style.display = "none";
            nextBtn.style.display = "none";
            optionsContainer.innerHTML = "";
            
            const currentQ = quizData[currentQuestionIndex];
            questionText.innerText = currentQ.question;
            progressText.innerText = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;

            currentQ.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.innerText = option;
                button.classList.add('btn');
                button.onclick = () => checkAnswer(index, button);
                optionsContainer.appendChild(button);
            });
        }

        function checkAnswer(selectedIndex, buttonClicked) {
            if (!acceptingAnswers) return;
            acceptingAnswers = false;

            const currentQ = quizData[currentQuestionIndex];
            const correctIndex = currentQ.answer;
            const allButtons = optionsContainer.children;

            if (selectedIndex === correctIndex) {
                buttonClicked.classList.add('correct');
                feedbackText.innerText = "RESPECT +";
                feedbackText.style.color = "#2ecc71";
                score++;
            } else {
                buttonClicked.classList.add('wrong');
                allButtons[correctIndex].classList.add('correct'); // Show correct answer
                feedbackText.innerText = "WASTED";
                feedbackText.style.color = "#e74c3c";
            }

            feedbackText.style.display = "block";
            nextBtn.style.display = "block";
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            quizScreen.style.display = "none";
            endScreen.style.display = "block";
            progressText.innerText = "Mission Passed?";

            const endTitle = document.getElementById('end-title');
            const finalScoreText = document.getElementById('final-score-text');
            const endMessage = document.getElementById('end-message');

            finalScoreText.innerText = `Score: ${score} / ${quizData.length}`;

            if (score === quizData.length) {
                endTitle.innerText = "HEIST SUCCESSFUL!";
                endTitle.style.color = "#f1c40f";
                endMessage.innerText = "Flawless run. You know Los Santos better than Rockstar.";
            } else if (score >= 3) {
                endTitle.innerText = "MISSION PASSED";
                endTitle.style.color = "#2ecc71";
                endMessage.innerText = "Not bad, but Lester thinks you can do better.";
            } else {
                endTitle.innerText = "MISSION FAILED";
                endTitle.style.color = "#e74c3c";
                endMessage.innerText = "You'll be sleeping with the fishes. Try again.";
            }
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            quizScreen.style.display = "block";
            endScreen.style.display = "none";
            loadQuestion();
        }

        // Start the quiz
        loadQuestion();
    </script>
</body>
</html>
