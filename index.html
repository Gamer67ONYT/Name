<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V: THE MASTER HEIST</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700;900&display=swap');

        :root {
            --gta-green: #2ecc71;
            --gta-red: #e74c3c;
            --gta-gold: #f1c40f;
            --gta-blue: #3498db;
            --glass: rgba(0, 0, 0, 0.75);
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Inter', sans-serif;
            color: #fff; overflow: hidden;
            background-color: #000;
        }

        /* FULLSCREEN VIDEO BACKGROUND */
        .video-bg {
            position: fixed;
            top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            width: auto; height: auto;
            z-index: -3;
            transform: translate(-50%, -50%);
            object-fit: cover;
            filter: brightness(0.4) contrast(1.2) saturate(1.2);
        }

        /* FX OVERLAYS */
        .overlay-fx {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.8) 100%);
            z-index: -2; pointer-events: none;
        }

        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 2px 100%;
            z-index: -1; pointer-events: none;
        }

        /* MAIN UI */
        .container {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh; padding: 20px;
        }

        .main-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-top: 6px solid var(--gta-green);
            border-radius: 4px; padding: 40px;
            width: 100%; max-width: 850px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
            position: relative;
            animation: slideIn 0.8s cubic-bezier(0.2, 1, 0.3, 1);
        }

        h1 {
            font-family: 'Bebas Neue', cursive; font-size: 6rem;
            text-align: center; margin: 0; letter-spacing: 4px;
            color: #fff; text-shadow: 0 0 30px var(--gta-green);
        }

        /* HUD ELEMENTS */
        .top-hud {
            display: flex; justify-content: space-between;
            margin-bottom: 30px; font-family: 'Bebas Neue', cursive;
            font-size: 2rem; border-bottom: 2px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .money { color: var(--gta-green); }
        .wanted { color: var(--gta-gold); }

        /* PROGRESS BAR */
        .timer-slot {
            width: 100%; height: 6px; background: rgba(255,255,255,0.1);
            margin-bottom: 30px; overflow: hidden;
        }
        .timer-fill {
            height: 100%; width: 100%; background: var(--gta-green);
            transition: width 1s linear;
        }

        /* QUIZ CONTENT */
        #q-box { font-size: 2rem; font-weight: 900; text-align: center; margin-bottom: 40px; }

        .options-container {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
        }

        .choice-btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2);
            color: #fff; padding: 25px; font-size: 1.2rem; font-weight: 700;
            cursor: pointer; transition: all 0.2s; text-transform: uppercase;
        }

        .choice-btn:hover {
            background: #fff; color: #000; transform: scale(1.02);
        }

        .choice-btn.correct { background: var(--gta-green) !important; color: #000; border-color: #fff; }
        .choice-btn.wrong { background: var(--gta-red) !important; color: #fff; border-color: #fff; }

        /* SCREENS */
        .screen { display: none; text-align: center; }
        .active { display: block; }

        .big-btn {
            background: var(--gta-gold); color: #000; border: none;
            padding: 20px 60px; font-family: 'Bebas Neue', cursive;
            font-size: 2.5rem; cursor: pointer; margin-top: 20px;
            transition: 0.3s;
        }

        .big-btn:hover { background: #fff; box-shadow: 0 0 30px var(--gta-gold); }

        /* ANIMATIONS */
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(50px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        #splash-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-family: 'Bebas Neue', cursive; font-size: 10rem;
            z-index: 100; pointer-events: none; opacity: 0;
        }
    </style>
</head>
<body>

    <!-- PROFESSIONAL VIDEO SOURCE -->
    <video class="video-bg" autoplay loop muted playsinline>
        <source src="https://cdn.pixabay.com/video/2021/04/12/70796-537446522_large.mp4" type="video/mp4">
    </video>

    <div class="overlay-fx"></div>
    <div class="scanlines"></div>

    <div class="container">
        <div class="main-card">
            
            <!-- START SCREEN -->
            <div id="start-screen" class="screen active">
                <h1>LOS SANTOS <span>TRIVIA</span></h1>
                <p style="font-size: 1.5rem; color: #ccc; margin: 30px 0;">Initialize Bank Heist. 10 Rounds. 15 Seconds. High Stakes.</p>
                <button class="big-btn" onclick="startGame()">START HEIST</button>
            </div>

            <!-- GAME SCREEN -->
            <div id="game-screen" class="screen">
                <div class="top-hud">
                    <div class="money" id="money-display">$000,000,000</div>
                    <div class="wanted" id="wanted-display">★★★★★</div>
                </div>
                <div class="timer-slot"><div class="timer-fill" id="timer-bar"></div></div>
                <div id="q-box">INTEL LOADING...</div>
                <div class="options-container" id="opt-container"></div>
            </div>

            <!-- END SCREEN -->
            <div id="end-screen" class="screen">
                <h2 id="end-title" style="font-family: 'Bebas Neue', cursive; font-size: 5rem;"></h2>
                <div id="final-money" style="font-size: 4rem; color: var(--gta-green); font-family: 'Bebas Neue';"></div>
                <button class="big-btn" onclick="location.reload()">REPLAY HEIST</button>
            </div>

        </div>
    </div>

    <div id="splash-text">WASTED</div>

    <script>
        const db = [
            { q: "What is the name of the fictional city in GTA V?", o: ["Liberty City", "Vice City", "Los Santos", "San Fierro"], a: 2 },
            { q: "Which character is a retired bank robber?", o: ["Franklin", "Trevor", "Michael", "Lamar"], a: 2 },
            { q: "What is the name of Franklin's dog?", o: ["Chop", "Buster", "Killer", "Dawg"], a: 0 },
            { q: "What company makes the 'iFruit' phone?", o: ["Fruit", "Badger", "Shark", "Lifeinvader"], a: 0 },
            { q: "Who runs Trevor Philips Enterprises?", o: ["Ron", "Wade", "Chef", "Trevor"], a: 3 },
            { q: "What is the highest mountain?", o: ["Mount Gordo", "Mount Josiah", "Mount Chiliad", "Everest"], a: 2 },
            { q: "Which PMC is a major antagonist?", o: ["SecuroServ", "Merryweather", "Gruppe Sechs", "Ballas"], a: 1 },
            { q: "What is the parody of Facebook?", o: ["Bleeter", "Lifeinvader", "Snapmatic", "Chirper"], a: 1 },
            { q: "Which protagonist lives in Sandy Shores?", o: ["Franklin", "Michael", "Lamar", "Trevor"], a: 3 },
            { q: "Who is the corrupt FIB agent?", o: ["Steve Haines", "Dave Norton", "Andreas", "Karen"], a: 0 },
            { q: "The social media site parodying Twitter is?", o: ["Bleeter", "Lifeinvader", "Snapmatic", "Chirper"], a: 0 },
            { q: "What color do the Grove Street Families wear?", o: ["Purple", "Yellow", "Green", "Red"], a: 2 },
            { q: "What is the name of the military base?", o: ["Area 51", "Fort Zancudo", "Naval Base", "Vespucci"], a: 1 },
            { q: "Who is Franklin's best friend?", o: ["Lamar", "Simeon", "Stretch", "Jimmy"], a: 0 },
            { q: "What is the name of Trevor's pilot friend?", o: ["Ron", "Wade", "Floyd", "Brad"], a: 0 }
        ];

        let gameList = [];
        let cur = 0;
        let cash = 0;
        let stars = 5;
        let timer;
        let timeLeft = 15;
        let lock = false;

        function startGame() {
            gameList = [...db].sort(() => 0.5 - Math.random()).slice(0, 10);
            cur = 0; cash = 0; stars = 5;
            document.getElementById('start-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            updateHUD();
            loadQ();
        }

        function updateHUD() {
            document.getElementById('money-display').innerText = `$${cash.toLocaleString()}`;
            let s = "";
            for(let i=0; i<5; i++) s += (i < stars) ? "★" : "☆";
            document.getElementById('wanted-display').innerText = s;
        }

        function loadQ() {
            if(stars <= 0) return end(false);
            if(cur >= gameList.length) return end(true);

            lock = false;
            const data = gameList[cur];
            document.getElementById('q-box').innerText = data.q;
            const container = document.getElementById('opt-container');
            container.innerHTML = "";

            data.o.forEach((opt, i) => {
                const b = document.createElement('button');
                b.className = 'choice-btn';
                b.innerText = opt;
                b.onclick = () => check(i, b);
                container.appendChild(b);
            });

            startTimer();
        }

        function startTimer() {
            clearInterval(timer);
            timeLeft = 15;
            const bar = document.getElementById('timer-bar');
            bar.style.transition = 'none';
            bar.style.width = '100%';
            bar.style.backgroundColor = 'var(--gta-green)';
            setTimeout(() => bar.style.transition = 'width 1s linear', 50);

            timer = setInterval(() => {
                timeLeft--;
                bar.style.width = `${(timeLeft/15)*100}%`;
                if(timeLeft <= 5) bar.style.backgroundColor = 'var(--gta-red)';
                if(timeLeft <= 0) { clearInterval(timer); check(-1, null); }
            }, 1000);
        }

        function check(idx, btn) {
            if(lock) return;
            lock = true;
            clearInterval(timer);

            const correct = gameList[cur].a;
            const buttons = document.querySelectorAll('.choice-btn');

            if(idx === correct) {
                btn.classList.add('correct');
                cash += 250000;
                flashText("RESPECT +", "var(--gta-green)");
            } else {
                if(btn) btn.classList.add('wrong');
                buttons[correct].classList.add('correct');
                stars--;
                flashText("WASTED", "var(--gta-red)");
            }

            updateHUD();
            cur++;
            setTimeout(loadQ, 2000);
        }

        function flashText(txt, color) {
            const el = document.getElementById('splash-text');
            el.innerText = txt;
            el.style.color = color;
            el.style.opacity = '1';
            el.style.transform = 'translate(-50%, -50%) scale(1.2)';
            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translate(-50%, -50%) scale(1)';
            }, 1500);
        }

        function end(win) {
            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('end-screen').classList.add('active');
            document.getElementById('end-title').innerText = win ? "HEIST SUCCESSFUL" : "MISSION FAILED";
            document.getElementById('end-title').style.color = win ? "var(--gta-gold)" : "var(--gta-red)";
            document.getElementById('final-money').innerText = `TOTAL TAKE: $${cash.toLocaleString()}`;
        }
    </script>
</body>
</html>
